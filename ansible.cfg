[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml


[ssh_connection]
# ForwardAgent lets remote hosts clone private GitHub repos (dotfiles) with your local SSH key.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
pipelining = True
