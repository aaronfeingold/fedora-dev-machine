---
# Defaults for every machine. Nothing personal lives in this repo: your values come from,
# highest priority first:
#   1. -e on the command line           ./run_playbook -e git_email=me@example.com
#   2. local.yml (gitignored)           cp local.example.yml local.yml
#   3. environment variables            export DOTFILES_REPO=me/dotfiles GIT_EMAIL=...
#   4. your `git config --global`       (on the machine running ansible-playbook)

# ---- You ----
git_name: "{{ lookup('env', 'GIT_NAME') or lookup('pipe', 'git config --global user.name || true') }}"
git_email: "{{ lookup('env', 'GIT_EMAIL') or lookup('pipe', 'git config --global user.email || true') }}"

# Dotfiles applied with chezmoi at the end. Empty = skip.
# "user/repo" means GitHub; a full git URL works too. Repos made from
# https://github.com/aaronfeingold/dotfiles-kit work out of the box.
dotfiles_repo: "{{ lookup('env', 'DOTFILES_REPO') }}"
# Clone "user/repo" over SSH (needed for private repos) instead of HTTPS.
dotfiles_ssh: "{{ lookup('env', 'DOTFILES_SSH') | default('true', true) | bool }}"

# Login shell for the user
user_shell: "{{ lookup('env', 'USER_SHELL') | default('/usr/bin/zsh', true) }}"

# ---- What to install ----
install_databases: false   # PostgreSQL + Valkey (Redis-compatible)
install_gui: false         # VS Code, Ghostty, fonts
install_ml: false          # uv venvs with PyTorch / TensorFlow in ~/.venvs
install_cloud_clis: true   # aws, gcloud, packer

# ---- NVIDIA ----
# Installed automatically when an NVIDIA GPU is detected (lspci).
# gpu_force: true installs it anyway (e.g. building an image on a non-GPU builder).
gpu_force: false
nvidia_cuda_toolkit: cuda-toolkit-13-4   # nvcc etc. PyTorch/TF wheels bundle their own CUDA runtime.
# Reboot automatically if the new driver needs it (never for the local machine).
gpu_allow_reboot: true
