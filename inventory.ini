# This machine (e.g. the Framework laptop). Run: ./run_playbook
[workstation]
localhost ansible_connection=local

# Cloud GPU boxes. Add hosts here (or pass -i "1.2.3.4," on the command line), then:
#   ./run_playbook -l gpu_cloud
[gpu_cloud]
# gpu1 ansible_host=203.0.113.10 ansible_user=fedora

[gpu_cloud:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
