---
- name: Remove distro container packages that conflict with Docker CE
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-common
      - docker-engine
      - moby-engine
    state: absent
  become: true

- name: Add Docker CE repo
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"
    force: true  # replace a stale or hand-disabled copy (e.g. left over from a Fedora upgrade)
  become: true
  register: docker_repo

- name: Install Docker CE
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true
  register: docker_install
  # --check doesn't write the new repo file, so dnf can't see its packages yet.
  ignore_errors: "{{ ansible_check_mode and docker_repo is changed }}"

# --check on a machine without Docker yet: there's no service or docker group to preview.
- name: Stop previewing docker (not installed yet)
  ansible.builtin.meta: end_role
  when: ansible_check_mode and (docker_install is changed or docker_install is failed)

- name: Start and enable Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  become: true
  when: systemd_running | bool

- name: Let {{ ansible_facts['user_id'] }} use docker without sudo (takes effect on next login)
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
