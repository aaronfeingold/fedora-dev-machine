---
# Rectangle-style window snapping for GNOME: https://github.com/aaronfeingold/gnometangle
# Installs a GitHub release (checksum-verified) and enables it for your user. Re-runs only download
# when the release changes. Skipped on machines without GNOME Shell.
install_gnometangle: true
gnometangle_github: aaronfeingold/gnometangle
gnometangle_version: latest # or pin a tag, e.g. v0.1.0
gnometangle_uuid: gnometangle@aaronfeingold.github.io
# gnometangle is the only window manager helper: remove Pop Shell and its package that rewrites
# GNOME's default shortcuts, so GNOME's own defaults come back (gnometangle frees any it needs).
gnometangle_remove_pop_shell: true
