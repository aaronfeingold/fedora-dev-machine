---
# Desktop-only bits (the Framework). Skipped on headless/cloud machines.
- name: Add VS Code repo
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
  become: true
  register: vscode_repo

- name: Add Ghostty COPR repo
  ansible.builtin.yum_repository:
    name: copr-scottames-ghostty
    description: Ghostty (COPR scottames/ghostty)
    baseurl: https://download.copr.fedorainfracloud.org/results/scottames/ghostty/fedora-$releasever-$basearch/
    gpgcheck: true
    gpgkey: https://download.copr.fedorainfracloud.org/results/scottames/ghostty/pubkey.gpg
  become: true
  register: ghostty_repo

# latest, not present: base's "upgrade all" runs before these repos exist, so a copy installed
# some other way (e.g. a downloaded VS Code RPM) would otherwise never be updated.
- name: Install desktop apps
  ansible.builtin.dnf:  # noqa: package-latest
    name:
      - code
      - ghostty
      - fontconfig
    state: latest
  become: true
  # --check doesn't write the new repo file, so dnf can't see its packages yet.
  ignore_errors: "{{ ansible_check_mode and (vscode_repo is changed or ghostty_repo is changed) }}"

- name: Create font dir
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/JetBrainsMono"
    state: directory
    mode: "0755"

- name: Install JetBrainsMono Nerd Font (used by Ghostty + nvim)
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/JetBrainsMono"
    remote_src: true
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/JetBrainsMono/JetBrainsMonoNerdFont-Regular.ttf"
  notify: Refresh font cache
