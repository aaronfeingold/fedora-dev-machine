# GNOME Shell extensions from extensions.gnome.org, installed for your user and enabled. Each entry
# takes the extension's uuid and optional settings (gsettings key: value in GVariant syntax).
# Re-runs only download when extensions.gnome.org has a newer version for this GNOME release.
gnome_extensions:
  # Maccy-style clipboard history: Super+Shift+C opens it (Cmd+Shift+C with the keyboard role),
  # start typing to search or use the arrows, Enter pastes into the app you were in.
  - uuid: clipboard-history@alexsaveau.dev
    settings:
      enable-typeahead-search: "true"
      toggle-menu: "['<Super><Shift>c']"
  # Spotlight-style search: Super+Space (Cmd+Space) opens a search box in the middle of the
  # screen for apps, files, settings, sums and web search. The keyboard role frees Super+Space
  # from GNOME's keyboard-layout switch for it.
  - uuid: spotlight@nin
    settings:
      toggle-shortcut: "['<Super>space']"
  # A Mac-style dock at the bottom that hides when a window covers it; clicking an open app
  # minimizes it, or shows its windows when it has several.
  - uuid: dash-to-dock@micxgx.gmail.com
    settings:
      dock-position: "'BOTTOM'"
      click-action: "'minimize-or-previews'"
      show-trash: "false"
      dash-max-icon-size: "32"
  # Frosted-glass blur behind the top bar, the overview and the dock.
  - uuid: blur-my-shell@aunetx
  # Turns individual parts of GNOME's interface on and off (Extensions app > Just Perfection).
  # Installed with its defaults, which change nothing until you do.
  - uuid: just-perfection-desktop@just-perfection

# Extensions this role used to install, disabled and removed on the next run.
gnome_extensions_removed:
  # Replaced by Spotlight: Search Light has no release for GNOME 50.
  - search-light@icedman.github.com
