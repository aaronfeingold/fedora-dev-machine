---
- name: Upgrade all packages (fresh cloud images are often months stale)
  ansible.builtin.dnf:  # noqa: package-latest
    name: "*"
    state: latest
    update_cache: true
  become: true
  when: base_upgrade | bool

- name: Add lazygit COPR repo
  ansible.builtin.yum_repository:
    name: copr-atim-lazygit
    description: lazygit (COPR atim/lazygit)
    baseurl: https://download.copr.fedorainfracloud.org/results/atim/lazygit/fedora-$releasever-$basearch/
    gpgcheck: true
    gpgkey: https://download.copr.fedorainfracloud.org/results/atim/lazygit/pubkey.gpg
  become: true
  register: lazygit_repo

- name: Install core CLI tools
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  become: true
  # --check doesn't write the new repo file, so dnf can't see its packages yet.
  ignore_errors: "{{ ansible_check_mode and lazygit_repo is changed }}"

- name: Make zsh the login shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ user_shell }}"
  become: true
