- name: Mac-style copy and paste (keyd)
  when: keyboard_mac_copy_paste | bool
  become: true
  block:
    - name: Add keyd COPR repo
      ansible.builtin.yum_repository:
        name: copr-alternateved-keyd
        description: keyd (COPR alternateved/keyd)
        baseurl: https://download.copr.fedorainfracloud.org/results/alternateved/keyd/fedora-$releasever-$basearch/
        gpgcheck: true
        gpgkey: https://download.copr.fedorainfracloud.org/results/alternateved/keyd/pubkey.gpg

    - name: Install keyd
      ansible.builtin.dnf:
        name: keyd
        state: present

    - name: Configure keyd
      ansible.builtin.template:
        src: keyd.conf.j2
        dest: /etc/keyd/default.conf
        mode: "0644"
      notify: Reload keyd

    - name: Start and enable keyd
      ansible.builtin.systemd_service:
        name: keyd
        state: started
        enabled: true
      when: systemd_running | bool

# Same session-bus handling as the gnome_extensions role: the logged-in session's bus if there is
# one, else a throwaway one (settings land in ~/.config/dconf either way).
- name: Screenshot shortcuts
  ansible.builtin.shell: |
    set -euo pipefail
    bus="/run/user/$(id -u)/bus"
    if [ -S "$bus" ]; then export DBUS_SESSION_BUS_ADDRESS="unix:path=$bus"; run=; else run=dbus-run-session; fi
    $run python3 - <<'PY'
    import json, subprocess

    def gsettings(*args):
        cmd = ["gsettings", *args[:1], "org.gnome.shell.keybindings", *args[1:]]
        return subprocess.run(cmd, check=True, capture_output=True, text=True).stdout.strip()

    for key, value in json.loads({{ keyboard_screenshot_shortcuts | to_json | to_json }}).items():
        if gsettings("get", key) != str(value):
            gsettings("set", key, str(value))
            print("CHANGED")
    PY
  args:
    executable: /bin/bash
  register: keyboard_screenshots
  changed_when: "'CHANGED' in keyboard_screenshots.stdout"
  when: keyboard_screenshot_shortcuts | length > 0
