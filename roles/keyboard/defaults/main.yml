# Mac-style copy and paste with the Super (Windows) key, in every app including terminals:
#   Super+C copy, Super+X cut, Super+V paste, Super+A select all (instead of GNOME's app grid),
#   Super+R reload, Super+Shift+R hard reload, Super+T new tab, Super+W close tab.
# keyd turns them into Ctrl+Insert / Shift+Delete / Shift+Insert, which GTK apps, browsers,
# Electron apps and Ghostty all treat as copy / cut / paste; Super+A/R/T/W become Ctrl+A/R/T/W
# (in a terminal that's the shell's Ctrl key: Super+R searches history, Super+W deletes a word).
# Super+Shift+C is passed through unchanged (Clipboard History opens on it). Other Super shortcuts are untouched.
keyboard_mac_copy_paste: true

# Mac-style screenshots with GNOME's built-in tool, which copies every capture to the clipboard
# (and saves it to ~/Pictures/Screenshots). Added next to GNOME's own Print key bindings.
#   Ctrl+Shift+Super+4  select an area, then Enter
#   Ctrl+Shift+Super+5  whole screen, instantly
keyboard_screenshot_shortcuts:
  show-screenshot-ui: ["Print", "<Control><Shift><Super>4"]
  screenshot: ["<Shift>Print", "<Control><Shift><Super>5"]

# Super+Space (Cmd+Space) opens GNOME's search, like Spotlight: the overview with the cursor
# in the search box, so you can start typing. Set to {} to leave it on Super alone.
keyboard_shell_shortcuts:
  toggle-overview: ["<Super>space"]

# GNOME also uses Super+Space to switch keyboard layouts, which only matters with more than one;
# this keeps the keyboard's own layout key for that. Set to {} to leave GNOME's binding alone.
keyboard_wm_shortcuts:
  switch-input-source: ["XF86Keyboard"]
