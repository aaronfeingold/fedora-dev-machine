---
- name: AJF Fedora machine
  hosts: all
  pre_tasks:
    - name: Fedora only
      ansible.builtin.assert:
        that: ansible_facts['distribution'] == "Fedora"
        fail_msg: "This playbook targets Fedora (tested on 43 and 44); found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
      tags: always

    # Containers/toolbox have systemd installed but not running; skip service management there.
    - name: Check whether systemd is running
      ansible.builtin.stat:
        path: /run/systemd/system
      register: systemd_dir
      tags: always

    - name: Set systemd_running
      ansible.builtin.set_fact:
        systemd_running: "{{ systemd_dir.stat.exists }}"
      tags: always

  roles:
    - { role: base, tags: [base] }
    - { role: python, tags: [base, python] }
    - { role: node, tags: [base, node] }
    - { role: docker, tags: [base, docker] }
    - { role: databases, tags: [db], when: install_databases | bool }
    - { role: cloud_cli, tags: [cloud], when: install_cloud_clis | bool }
    - { role: workstation, tags: [gui], when: install_gui | bool }
    - { role: gnometangle, tags: [gui, gnometangle], when: install_gui | bool and install_gnometangle | bool }
    - { role: rotate, tags: [gui, rotate], when: install_gui | bool and install_rotate | bool }
    - { role: nvidia, tags: [gpu] }
    - { role: ml, tags: [ml], when: install_ml | bool }
    - { role: dotfiles, tags: [dotfiles] }
